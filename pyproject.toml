[project]
name = "taxfolio"
version = "0.1.1"
description = "IBKR portfolio journal and CZ/SK tax analyzer"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "platformdirs>=4.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "keyring>=25",
]

[project.scripts]
taxfolio = "taxfolio.cli:main"

[project.gui-scripts]
taxfolio-gui = "taxfolio.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxfolio"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
# The project lives inside a home-directory git repo whose .gitignore would hide everything
respect-gitignore = false
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP046: PySide6 generics read clearer with typing.Generic.
# E501: translatable texts stay whole (one catalog entry each); the formatter still wraps code.
ignore = ["UP046", "E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
