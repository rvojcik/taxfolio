name: Release

# Builds the installers for Windows, macOS and Linux and attaches them to a GitHub release.
# Two ways to release version X.Y.Z (must match pyproject.toml):
#   - push a tag vX.Y.Z or X.Y.Z  → the release is created with notes from CHANGELOG.md
#   - publish a release in GitHub → the installers are attached to it (its text is kept)
# "Run workflow" only builds (installers in the run's artifacts) – a test without publishing.
on:
  push:
    tags: ["v*", "[0-9]*"]
  release:
    types: [published]
  workflow_dispatch:

# A tag pushed while creating the release in GitHub may start two runs: let them go one after another
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Windows runners default to cp1252; the app name and texts contain Czech characters
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Tag matches the version in pyproject.toml
        if: github.event_name != 'workflow_dispatch'
        run: uv run --no-project python packaging/release_info.py check-tag "${GITHUB_REF_NAME}"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: uv sync
      - run: uv run ruff check . && uv run mypy src
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # AppImage needs glibc 2.39+ (Ubuntu 24.04, Debian 13, Fedora 40 and newer)
          - os: windows-latest
          - os: macos-15  # Apple Silicon (macOS 14 runners are being retired)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 file
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: uv sync --group build
      - run: uv run --group build python packaging/build.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*-Setup.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    # tag push or published release; a manual "Run workflow" is only a test build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: python3 packaging/release_info.py notes "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create the release or attach to the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # created in GitHub (or by an earlier run): keep its text, add / replace the installers
            gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" installers/* --verify-tag --title "$TAG" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
